{% load static %}
<header class="header header--loggedIn" style="display: flex; align-items: center; justify-content: space-between; padding: 10px 20px;">
    <div class="container" style="display: flex; align-items: center; width: 100%;">
        <a href="{% url 'index_doctor' %}" class="header__logo" style="flex: 1; text-decoration: none;">
            <h1 style="margin: 0;">OnUs HMS</h1>
        </a>
        <form class="header__search" method="GET" action="{% url 'home' %}" style="flex: 2; display: flex; align-items: center; justify-content: center;">
            <label style="display: flex; align-items: center; width: 100%;">
                <svg version="1.1" xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
                    <title>search</title>
                    <path
                        d="M32 30.586l-10.845-10.845c1.771-2.092 2.845-4.791 2.845-7.741 0-6.617-5.383-12-12-12s-12 5.383-12 12c0 6.617 5.383 12 12 12 2.949 0 5.649-1.074 7.741-2.845l10.845 10.845 1.414-1.414zM12 22c-5.514 0-10-4.486-10-10s4.486-10 10-10c5.514 0 10 4.486 10 10s-4.486 10-10 10z">
                    </path>
                </svg>
                <input name="q" placeholder="Search for doctors" style="margin-left: 10px; flex: 1; padding: 5px;" />
            </label>
        </form>
        <nav class="header__menu" style="flex: 1; display: flex; align-items: center; justify-content: flex-end;">
            {% if request.user.is_authenticated %}
            <div class="header__user" style="display: flex; align-items: center; margin-right: 10px;">
                <a style="text-decoration: none;">
                    <p style="margin: 0;">{{request.user.username}} <span>@{{request.user.username}}</span></p>
                </a>
            </div>
            <div class="dropdown-menu" style="display: flex;">
                <a href="{% url 'logout' %}" class="dropdown-link" style="text-decoration: none; display: flex; align-items: center;">
                    <svg version="1.1" xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
                        <title>sign-out</title>
                        <path
                            d="M3 0h22c0.553 0 1 0 1 0.553l-0 3.447h-2v-2h-20v28h20v-2h2l0 3.447c0 0.553-0.447 0.553-1 0.553h-22c-0.553 0-1-0.447-1-1v-30c0-0.553 0.447-1 1-1z">
                        </path>
                        <path
                            d="M21.879 21.293l1.414 1.414 6.707-6.707-6.707-6.707-1.414 1.414 4.293 4.293h-14.172v2h14.172l-4.293 4.293z">
                        </path>
                    </svg>
                    Logout
                </a>
            </div>
            {% else %}
            <a href="{% url 'login' %}" style="text-decoration: none; display: flex; align-items: center;">
                <img src="{% static 'images/avatar.svg' %}" style="margin-right: 5px;" />
                <p style="margin: 0;">Login</p>
            </a>
            {% endif %}
        </nav>
    </div>
</header>
